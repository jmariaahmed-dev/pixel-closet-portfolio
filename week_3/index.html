<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 3 – CSS Self-Portrait</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>✨ Week 3 – CSS Self-Portrait ✨</h1>

  <div class="portrait">
    <!-- Hair Back -->
    <div class="hair-back"></div>

    <!-- Face -->
    <div class="face">

      <!-- Eyes -->
      <div class="eye left-eye"></div>
      <div class="eye right-eye"></div>

      <!-- Lashes -->
      <div class="lash l1"></div>
      <div class="lash l2"></div>
      <div class="lash r1"></div>
      <div class="lash r2"></div>

      <!-- Nose -->
      <div class="nose"></div>

      <!-- Lips -->
      <div class="lips"></div>

      <!-- Earrings -->
      <div class="earring left-earring"></div>
      <div class="earring right-earring"></div>

    </div>

    <!-- Hair Front -->
    <div class="hair-front"></div>

  </div>

  <!-- Added portrait info -->
  <div class="portrait-info">
    <h3>✨ Character Stats ✨</h3>
    <ul>
      <li>Hair: Long, straight, black</li>
      <li>Earrings: Gold hoops</li>
      <li>Lip: Pink gloss ready 💖</li>
      <li>Made using: HTML + CSS only</li>
    </ul>
  </div>
</body>
</html>
