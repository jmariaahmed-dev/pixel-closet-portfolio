<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 7 — Events & Interaction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <h1>Maria’s Pixel Closet</h1>
    <p class="subtitle">Week 7 — Events, Input, and Friction</p>

    <!-- Task 1: Activate / Deactivate -->
    <section>
      <h2>Theme Toggle</h2>
      <button id="activate">Activate</button>
      <button id="deactivate">Deactivate</button>
    </section>

    <!-- Task 2: Input event -->
    <section>
      <h2>Live Input</h2>
      <input id="textInput" type="text" placeholder="Type something…" />
      <p id="output"></p>
    </section>

    <!-- Task 3: Keyboard movement -->
    <section class="playground">
      <h2>Move the Item</h2>
      <div id="movable" aria-label="Movable fashion item"></div>
    </section>

    <!-- Friction element -->
    <section>
      <h2>Friction Button</h2>
      <button id="escapeBtn">Catch me</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
