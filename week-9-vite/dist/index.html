<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Week 9 – Node, npm & Vite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #fff0f6;
      font-family: system-ui, sans-serif;
      text-align: center;
      cursor: pointer;
    }

    h1 {
      color: #a855f7;
      margin-bottom: 0.5rem;
    }

    p {
      max-width: 420px;
      line-height: 1.5;
    }

    .hint {
      margin-top: 2rem;
      opacity: 0.7;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Week 9 ✨</h1>
    <p>
      This page demonstrates using <strong>Node.js</strong>,
      <strong>npm</strong>, and a third-party JavaScript library
      (<strong>canvas-confetti</strong>) inside a Vite project.
    </p>
    <p class="hint">Click anywhere to celebrate 🎉</p>
  </main>

  <!-- canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- confetti from mouse position -->
  <script>
    document.body.addEventListener("click", (event) => {
      const x = event.clientX / window.innerWidth;
      const y = event.clientY / window.innerHeight;

      confetti({
        particleCount: 120,
        spread: 90,
        gravity: 0.8,
        origin: { x, y }
      });
    });
  </script>
</body>
</html>
